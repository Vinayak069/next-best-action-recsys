name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -q -e ".[test]"
      - run: pytest -q
