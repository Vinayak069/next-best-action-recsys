name: Prepare data
# Downloads UCI Online Retail II (CC BY 4.0, Chen 2019) and publishes it as Parquet on the
# `data` branch. Started by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow openpyxl
      - name: Download and convert
        run: |
          curl -fL --retry 3 -o retail.zip "https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip"
          unzip -o retail.zip && ls -l
          set -o pipefail
          python scripts/prepare_retail.py online_retail_II.xlsx out 2>&1 | tee prep.log
      - name: Publish to the data branch
        run: |
          cp prep.log out/
          printf 'Online Retail II, UCI Machine Learning Repository (CC BY 4.0). Chen, D. (2019). https://doi.org/10.24432/C5CG6D\n' > out/README.md
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Data snapshot $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - name: Summary
        if: always()
        run: echo "::notice title=prep::$(cat prep.log | tr '\n' ' ' | cut -c1-2000)"
